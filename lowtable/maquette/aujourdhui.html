<title>Lowtable Aujourd'hui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --bg:#FAF8F2;--band:#0F1A12;--surface:#FFFFFF;--surface2:#EFECE3;--ink:#141414;--muted:#6B6F68;--line:#DAD6CA;
  --green:#2A7D26;--green-deep:#1F6A1C;--on-green:#FFFFFF;--ghost:rgba(42,125,38,.07);--warm:#E9A53B;--no:#E4472E;--leftover:#EAF3DF;--lime:#BFF05A;
  --shadow:0 2px 6px rgba(0,0,0,.05),0 18px 48px rgba(15,26,18,.10);
  --spring:cubic-bezier(.22,1.4,.36,1);--ease:cubic-bezier(.2,.8,.2,1);
  --f-ui:'Inter Tight',system-ui,sans-serif;--f-serif:'Instrument Serif',Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0E120F;--band:#080B09;--surface:#171C18;--surface2:#222822;--ink:#F3F1E8;--muted:#9AA394;--line:#2C332C;
  --green:#5FCB4A;--green-deep:#3FA632;--on-green:#0E120F;--ghost:rgba(95,203,74,.06);--warm:#F2B858;--no:#FF6B52;--leftover:#1E2A1B;--lime:#C9F76A;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 18px 48px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0E120F;--band:#080B09;--surface:#171C18;--surface2:#222822;--ink:#F3F1E8;--muted:#9AA394;--line:#2C332C;
  --green:#5FCB4A;--green-deep:#3FA632;--on-green:#0E120F;--ghost:rgba(95,203,74,.06);--warm:#F2B858;--no:#FF6B52;--leftover:#1E2A1B;--lime:#C9F76A;
  --shadow:0 2px 6px rgba(0,0,0,.3),0 18px 48px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:3px}
svg{display:block}
.ghost{position:fixed;left:-6vw;top:30vh;font:800 44vw/1 var(--f-ui);letter-spacing:-.06em;color:var(--ghost);white-space:nowrap;pointer-events:none;z-index:0}

/* ---------- structure : un écran, zéro défilement ---------- */
.app{position:relative;z-index:1;height:100%;max-width:480px;margin:0 auto;display:grid;grid-template-rows:auto auto 1fr auto;padding-inline:16px;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;height:52px}
.logo{font:800 19px/1 var(--f-ui);letter-spacing:-.04em}
.iconbtn{width:44px;height:44px;border:0;border-radius:50%;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--surface2);color:var(--ink)}

/* bande du jour */
.day{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.day .date{font:400 26px/1 var(--f-serif)}
.day .date em{font-style:italic;color:var(--muted)}
.meals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.meal{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:52px;transition:border-color .2s,transform .25s var(--spring),background .2s}
.meal:active{transform:scale(.97)}
.meal .k{font:700 10px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:5px}
.meal .n{font:700 12px/1.2 var(--f-ui);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meal[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.meal.done{background:var(--leftover);border-color:transparent}
.meal.done .n{color:var(--muted);text-decoration:line-through}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.meal.done .dot{background:var(--green)}
.meal[aria-current="true"] .dot{background:var(--ink)}

/* paquet de cartes */
.deck{position:relative;min-height:0;perspective:1200px}
.card{position:absolute;inset:0 0 14px 0;background:var(--surface);border-radius:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;cursor:grab}
.card.back1{transform:translateY(10px) scale(.95);opacity:.75;box-shadow:none;border:1px solid var(--line);cursor:default}
.card.back2{transform:translateY(20px) scale(.9);opacity:.45;box-shadow:none;border:1px solid var(--line);cursor:default}
.card.front{z-index:3}
.card .band{display:flex;justify-content:space-between;gap:12px;white-space:nowrap;padding:11px 18px;font:700 10px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;background:var(--green);color:var(--on-green)}
.card .band span:first-child{overflow:hidden;text-overflow:ellipsis}
.card .band.leftover{background:var(--band);color:var(--lime)}
.card .band.batch{background:var(--warm);color:#141414}
.card .band.bf{background:var(--surface2);color:var(--ink)}
.art{flex:1;min-height:0;display:grid;place-items:center;padding:4px 8px 0}
.art svg{width:100%;height:100%;max-height:100%;overflow:visible}
.art .L{transform-box:fill-box;transform-origin:50% 50%}
.art .pile{animation:float 4s ease-in-out infinite alternate}
@keyframes float{to{transform:translateY(-2px)}}
.info{padding:0 20px 18px;display:flex;flex-direction:column;gap:8px}
.tagline{font:400 19px/1.1 var(--f-serif);color:var(--muted)}
.tagline em{color:var(--green)}
.title{margin:0;font:800 clamp(24px,7vw,30px)/1 var(--f-ui);letter-spacing:-.035em;text-wrap:balance}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:700 12px/1 var(--f-ui);padding:7px 10px;border-radius:999px;background:var(--surface2);font-variant-numeric:tabular-nums}
.hintup{display:flex;align-items:center;justify-content:center;gap:6px;font:700 10px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.stamp{position:absolute;top:58px;z-index:4;padding:6px 14px;border:3px solid currentColor;border-radius:10px;background:var(--surface);font:800 30px/1 var(--f-ui);opacity:0;pointer-events:none}
.stamp.yes{left:18px;color:var(--green);transform:rotate(-12deg)}
.stamp.no{right:18px;color:var(--no);transform:rotate(12deg)}

/* actions sous le pouce */
.actions{display:flex;align-items:center;justify-content:center;gap:18px;padding:10px 0 8px}
.round{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .2s var(--spring),background .2s}
.round:active{transform:scale(.9)}
.round.no{border:2px solid var(--ink);background:var(--surface);color:var(--ink)}
.round.yes{width:72px;height:72px;border:0;background:var(--green);color:var(--on-green);box-shadow:0 10px 24px color-mix(in srgb,var(--green) 35%,transparent)}
.pillbtn{height:48px;padding:0 20px;border-radius:999px;border:2px solid var(--ink);background:transparent;font:800 12px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:8px;transition:transform .2s var(--spring)}
.pillbtn:active{transform:scale(.95)}

/* nav */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(448px,calc(100% - 32px));display:flex;gap:4px;padding:6px;border-radius:999px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--shadow);z-index:5}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:999px;padding:7px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font:700 10px/1 var(--f-ui);letter-spacing:.04em;cursor:pointer;transition:background .25s var(--ease),color .25s}
nav.tabs button[aria-selected="true"]{background:var(--green);color:var(--on-green)}

/* panneau de détails */
.scrim{position:fixed;inset:0;background:rgba(10,14,11,.35);opacity:0;pointer-events:none;transition:opacity .3s var(--ease);z-index:8}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;max-width:480px;margin:0 auto;height:92%;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .45s var(--spring);display:flex;flex-direction:column}
.sheet.on{transform:translateY(0)}
.sheet.drag{transition:none}
.grab{padding:10px 0 6px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--line)}
.sheet .scroll{overflow-y:auto;overscroll-behavior:contain;padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .tg{font:400 clamp(26px,7vw,36px)/1.02 var(--f-serif);display:flex;flex-direction:column}
.sheet .tg em{color:var(--green)}
.sheet h2{margin:0;font:800 26px/1 var(--f-ui);letter-spacing:-.035em}
.eyebrow{font:700 10px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.band4{display:grid;grid-template-columns:repeat(4,1fr);border-block:1px solid var(--line)}
.band4 div{padding:10px 0 10px 10px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
.band4 div:first-child{border-left:0;padding-left:0}
.band4 b{font:800 24px/1 var(--f-ui);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.band4 small{font:700 10px/1 var(--f-ui);letter-spacing:.1em;color:var(--muted)}
.anat{position:relative;--lab:0}
.anat svg.pileSvg{width:100%;overflow:visible}
.anat .L{transform-box:fill-box;transform-origin:50% 50%}
.anat .lines{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;opacity:var(--lab)}
.anat .lines polyline{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:1}
.anat .lines circle{fill:var(--ink)}
.lab{position:absolute;left:0;top:0;width:50%;display:flex;flex-direction:column;gap:1px;opacity:var(--lab);pointer-events:none}
.lab b{font:700 13px/16px var(--f-ui)}
.lab b span{font-weight:500;color:var(--muted)}
.lab p{margin:0;font:500 12px/15px var(--f-ui);color:var(--muted)}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;font:500 15px/1.45 var(--f-ui)}
.steps li::before{content:counter(s);font:400 22px/1 var(--f-serif);color:var(--green)}
.cta{height:56px;border:0;border-radius:999px;background:var(--green);color:var(--on-green);font:800 13px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}

/* mode cuisiner */
.cook{position:fixed;inset:0;z-index:12;background:var(--band);color:#F3F1E8;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 12px) 20px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(100%);transition:transform .45s var(--spring);touch-action:pan-y}
.cook.on{transform:none}
.cook .head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px}
.cook .head .t{font:700 11px/1.3 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#9AA394}
.cook .close{width:44px;height:44px;border-radius:50%;border:1px solid #2C332C;background:transparent;color:#F3F1E8;display:grid;place-items:center;cursor:pointer}
.segs{display:flex;gap:4px;margin:10px 0 0}
.segs i{flex:1;height:4px;border-radius:2px;background:#2C332C;overflow:hidden;position:relative}
.segs i.on::after{content:"";position:absolute;inset:0;background:#5FCB4A}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;min-height:0}
.stage .num{font:400 clamp(64px,20vw,110px)/.9 var(--f-serif);color:#5FCB4A}
.stage .num small{font-size:.4em;color:#9AA394}
.stage p{margin:0;font:700 clamp(24px,6.6vw,34px)/1.18 var(--f-ui);letter-spacing:-.02em;text-wrap:pretty}
.stage.anim{animation:stepIn .4s var(--spring)}
@keyframes stepIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.timer{align-self:flex-start;display:flex;align-items:center;gap:12px;height:56px;padding:0 18px 0 8px;border-radius:999px;border:1px solid #2C332C;background:#171C18;color:#F3F1E8;cursor:pointer;font:800 18px/1 var(--f-ui);font-variant-numeric:tabular-nums}
.timer svg{width:40px;height:40px}
.timer.run{border-color:#5FCB4A}
.timer.run svg circle:last-child{stroke:#5FCB4A}
.timer.over{background:#5FCB4A;color:#0E120F;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.cook .nav2{display:flex;gap:10px}
.cook .nav2 button{flex:1;height:60px;border-radius:999px;font:800 13px/1 var(--f-ui);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.cook .prev{border:1px solid #2C332C;background:transparent;color:#F3F1E8}
.cook .next{border:0;background:#5FCB4A;color:#0E120F}
.cook .ingbtn{border:0;background:transparent;color:#9AA394;font:700 11px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:12px 0;align-self:center}
.ingl{margin:0;padding:12px 16px;list-style:none;border-radius:16px;background:#171C18;display:none;font:500 14px/1.6 var(--f-ui);columns:2;column-gap:18px}
.ingl.on{display:block}
.wake{font:500 11px/1 var(--f-ui);color:#9AA394;text-align:center;padding-top:8px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:20}
.confetto{position:absolute;width:10px;height:10px;border-radius:50%}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);z-index:15;transform:translate(-50%,20px);padding:12px 20px;border-radius:999px;background:var(--ink);color:var(--bg);font:700 13px/1.2 var(--f-ui);max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .35s var(--spring)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{font:700 10px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:var(--surface2);padding:5px 10px;border-radius:999px;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (min-height:760px){.title{font-size:clamp(26px,7.4vw,32px)}}
</style>

  /* La journée type : mardi. Le petit-déj est déjà mangé, on est au déjeuner. */
  const day = [
    { kind: 'Petit-déj', id: 'petitdej-omelette-jambon', done: true, bf: true },
    { kind: 'Déjeuner', id: 'tajine-poulet-citron', leftover: 'Reste de dim. soir' },
    { kind: 'Dîner', id: 'saumon-pesto-haricots' },
  ];
  const alternates = ['keftas-concombre-feta', 'poulet-citron-poireaux'];
  let cur = 1;

  function tagHtml(t) { const w = t.split(' '); return w.map((x, i) => i === w.length - 1 ? `<em>${esc(x)}</em>` : esc(x)); }
  function bandFor(m, r) {
    if (m.bf) return ['bf', 'Petit-déj', `${r.time} min`];
    if (m.leftover) return ['leftover', m.leftover, 'Rien à cuisiner'];
    if (r.meals >= 3) return ['batch', 'Grand batch', `${r.meals} repas pour 2`];

  }

  /* ---------- bande du jour ---------- */
  function renderMeals() {
    $('#meals').innerHTML = day.map((m, i) => `<button class="meal ${m.done ? 'done' : ''}" data-i="${i}" aria-current="${i === cur}"><span class="k"><span class="dot"></span>${m.kind}</span><span class="n">${esc(DATA[m.id].name)}</span></button>`).join('');
    document.querySelectorAll('.meal').forEach(b => b.onclick = () => { const i = +b.dataset.i; if (i !== cur) { cur = i; renderMeals(); renderDeck(true); } });
  }

  /* ---------- carte ---------- */
  function cardHtml(m, cls) {
    const r = DATA[m.id], [bc, bl, br] = bandFor(m, r);
    return `<article class="card ${cls}">
      <div class="stamp yes">MIAM</div><div class="stamp no">NOPE</div>
      <div class="band ${bc}"><span>${esc(PROT[r.protein] || '')} · ${esc(bl)}</span><span>${esc(br)}</span></div>

        <h1 class="title">${esc(r.name)}</h1>
        <div class="chips"><span class="chip">${r.time} min</span><span class="chip">${r.carbs} g gluc.</span><span class="chip">${r.prot} g prot.</span><span class="chip">${r.kcal} kcal</span></div>

  }
  let front = null;
  function renderDeck(anim) {
    const m = day[cur];
    const nextIds = [day[cur + 1], day[cur + 2]].filter(Boolean);
    $('#deck').innerHTML = [...nextIds.slice(0, 2).map((x, k) => cardHtml(x, k ? 'back2' : 'back1')).reverse(), cardHtml(m, 'front')].join('');

  function build(card) {

    card.animate([{ transform: 'translateY(18px) scale(.97)', opacity: 0 }, { transform: 'none', opacity: card.style.opacity || 1 }], { duration: 380, easing: SPRING });

      const i = +g.dataset.layer, el = g.firstElementChild; if (!el) return;
      if (i === 0) return el.animate([{ transform: 'scale(.85)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 420, easing: SPRING, fill: 'backwards' });
      const d = 120 + (i - 1) * 85, rr = (Math.random() * 6 - 3).toFixed(1);
      if (g.dataset.finish === '1') return [...el.children].forEach(it => it.animate([{ transform: 'translateY(-30px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 300, easing: EASE, delay: d + Math.random() * 250, fill: 'backwards' }));
      el.animate([{ transform: `translateY(-38px) rotate(${rr}deg)`, opacity: 0 }, { opacity: 1, offset: .35 }, { transform: 'none', opacity: 1 }], { duration: 440, easing: SPRING, delay: d, fill: 'backwards' });
    });
  }

  /* ---------- gestes : horizontal = verdict, vers le haut = recette ---------- */
  function bindSwipe(card) {
    let g = null, raf = 0;
    const yes = card.querySelector('.stamp.yes'), no = card.querySelector('.stamp.no');
    card.addEventListener('pointerdown', e => { g = { x: e.clientX, y: e.clientY, dx: 0, dy: 0, cx: 0, mode: null, id: e.pointerId, t: performance.now() }; });
    card.addEventListener('pointermove', e => {
      if (!g) return;
      g.dx = e.clientX - g.x; g.dy = e.clientY - g.y;
      if (!g.mode && Math.hypot(g.dx, g.dy) > 8) {
        g.mode = Math.abs(g.dx) > Math.abs(g.dy) ? 'swipe' : (g.dy < 0 ? 'up' : null);
        if (!g.mode) { g = null; return; }
        try { card.setPointerCapture(g.id); } catch (_) {}
        if (g.mode === 'swipe') loop();
      }
      if (g && g.mode === 'up') card.style.transform = `translateY(${Math.max(-60, g.dy * .35)}px)`;
    });
    function loop() {
      if (!g || g.mode !== 'swipe') return;
      g.cx += (g.dx - g.cx) * .2;
      card.style.transform = `translateX(${g.cx}px) rotate(${g.cx / 20}deg)`;
      const a = Math.min(1, Math.abs(g.cx) / 100);
      (g.cx > 0 ? yes : no).style.opacity = a; (g.cx > 0 ? no : yes).style.opacity = 0;
      if (a >= 1 && !g.buzz) { g.buzz = 1; navigator.vibrate && navigator.vibrate(10); }
      if (a < 1) g.buzz = 0;
      raf = requestAnimationFrame(loop);
    }
    const end = () => {
      if (!g) return; const m = g.mode, cx = g.cx, dy = g.dy, quick = performance.now() - g.t < 300; cancelAnimationFrame(raf); g = null;
      if (m === 'up') { card.animate([{ transform: card.style.transform }, { transform: 'none' }], { duration: 300, easing: SPRING }); card.style.transform = ''; if (dy < -50 || quick) openSheet(); return; }
      if (m !== 'swipe') { openSheet(); return; }
      if (cx > 90) return accept();
      if (cx < -90) return refuse();
      card.animate([{ transform: card.style.transform }, { transform: 'none' }], { duration: 350, easing: SPRING }); card.style.transform = ''; yes.style.opacity = no.style.opacity = 0;
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', () => { g = null; card.style.transform = ''; });
  }
  function fly(dir, then) {
    const card = front; if (!card) return then();
    if (RM.matches) return then();
    card.querySelector(dir > 0 ? '.stamp.yes' : '.stamp.no').style.opacity = 1;
    card.animate([{ transform: card.style.transform || 'none' }, { transform: `translateX(${dir * 130}%) rotate(${dir * 16}deg)`, opacity: 0 }], { duration: 320, easing: EASE, fill: 'forwards' }).finished.then(then);
  }
  function accept() {
    const m = day[cur]; if (m.done) { toast('Déjà mangé'); return; }
    navigator.vibrate && navigator.vibrate([12, 40, 12]);
    confetti();
    fly(1, () => { m.done = true; const nxt = day.findIndex((x, i) => i > cur && !x.done); if (nxt >= 0) cur = nxt; renderMeals(); renderDeck(true); if (nxt < 0) toast('Journée bouclée. Demain, on recommence.'); });
  }
  function refuse() {
    const m = day[cur];
    if (m.done) { toast('Déjà mangé'); return; }
    fly(-1, () => {
      const old = DATA[m.id].name;
      m.id = alternates.shift() || m.id; alternates.push(DATA.__none__ ? '' : m.id);
      if (m.leftover) { m.leftover = null; toast(`Le reste de ${old.split(',')[0].toLowerCase()} passe à jeudi midi`); }
      else toast('Remplacé — la liste de courses est à jour');
      renderMeals(); renderDeck(true);
    });
  }
  function confetti() {
    if (RM.matches) return;
    const fx = $('#fx'), rc = front.getBoundingClientRect(), cx = rc.left + rc.width / 2, cy = rc.top + rc.height * .4;
    const cs = getComputedStyle(document.documentElement), cols = ['--green', '--lime', '--warm', '--ink'].map(v => cs.getPropertyValue(v));
    for (let j = 0; j < 22; j++) {
      const d = document.createElement('i'); d.className = 'confetto'; d.style.background = cols[j % 4]; d.style.left = cx + 'px'; d.style.top = cy + 'px'; fx.appendChild(d);
      const a = Math.random() * Math.PI * 2, v = 90 + Math.random() * 120, x = Math.cos(a) * v, y = Math.sin(a) * v * .8 - 40;
      d.animate([{ transform: 'translate(-50%,-50%) scale(.4)' }, { transform: `translate(calc(-50% + ${x * .8}px),calc(-50% + ${y}px)) scale(1)`, offset: .55 }, { transform: `translate(calc(-50% + ${x}px),calc(-50% + ${y + 70}px)) scale(.9)`, opacity: 0 }], { duration: 800, easing: EASE, fill: 'forwards' }).finished.then(() => d.remove());
    }
  }
  $('#btnYes').onclick = accept; $('#btnNo').onclick = refuse; $('#btnCook').onclick = () => openCook(day[cur].id);
  document.addEventListener('keydown', e => { if ($('#cook').classList.contains('on') || $('#sheet').classList.contains('on')) return; if (e.key === 'ArrowRight') accept(); if (e.key === 'ArrowLeft') refuse(); if (e.key === 'ArrowUp') openSheet(); });

  /* ---------- panneau recette : l'anatomie s'ouvre avec le panneau ---------- */
  const S = .5, GAP = 170, OX = -104;
  function openSheet() {
    const m = day[cur], r = DATA[m.id];
    $('#sheetBody').innerHTML = `
      <div class="eyebrow">${esc(PROT[r.protein] || '')} · ${m.leftover ? 'reste · rien à cuisiner' : (r.meals > 1 ? r.meals + ' repas pour 2' : 'pour 2')}</div>
      <div class="tg">${tagHtml(r.tagline).map(w => `<span>${w}</span>`).join('')}</div>
      <h2>${esc(r.name)}</h2>
      <div class="band4"><div><b>${r.time}</b><small>MIN</small></div><div><b>${r.carbs}</b><small>G GLUC.</small></div><div><b>${r.prot}</b><small>G PROT.</small></div><div><b>${r.kcal}</b><small>KCAL</small></div></div>
      <div class="eyebrow">Anatomie · ${r.labels.length} couches</div>
      <div class="anat" id="anat"><svg class="pileSvg" viewBox="0 90 400 210"><g class="xpile">${r.svg}</g></svg><svg class="lines" aria-hidden="true"></svg>
        ${r.labels.map(L => `<div class="lab" data-for="${L.id}"><b>${esc(L.title)}${L.qty ? ` <span>${esc(L.qty)}</span>` : ''}</b><p>${esc(L.note)}</p></div>`).join('')}</div>
      <div class="eyebrow">Étapes</div>
      <ol class="steps">${r.steps.map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ol>
      <button class="cta" id="sheetCook">${m.leftover ? 'Réchauffer' : 'Lancer la cuisson'}</button>`;
    $('#sheetCook').onclick = () => { closeSheet(); openCook(m.id); };
    $('#sheet').classList.add('on'); $('#scrim').classList.add('on'); $('#sheet').setAttribute('aria-hidden', 'false');
    $('#sheetBody').scrollTop = 0;
    const A = anatomy($('#anat'));
    let t0 = null; const dur = RM.matches ? 0 : 900;
    const step = now => { if (t0 == null) t0 = now; const x = dur ? Math.min(1, (now - t0) / dur) : 1; A.set(1 - Math.pow(1 - x, 3)); if (x < 1) requestAnimationFrame(step); };
    setTimeout(() => requestAnimationFrame(step), 220);
  }
  function anatomy(box) {
    const svg = box.querySelector('.pileSvg'), pile = box.querySelector('.xpile'), lines = box.querySelector('.lines');
    const layers = [...svg.querySelectorAll('[data-layer]')].map(g => {
      const [dx, rot, cy] = (g.dataset.explode || '0,0,190').split(',').map(Number), [ax, ay] = (g.dataset.anchor || '0,0').split(',').map(Number);
      return { g, i: +g.dataset.layer, dx, rot, cy, ax, ay, label: box.querySelector(`[data-for="${g.id}"]`) };
    });
    const lab = layers.filter(L => L.label).sort((a, b) => b.i - a.i);
    lab.forEach(L => { const ns = 'http://www.w3.org/2000/svg'; L.line = document.createElementNS(ns, 'polyline'); L.line.setAttribute('pathLength', '1'); L.dot = document.createElementNS(ns, 'circle'); L.dot.setAttribute('r', '2.5'); lines.append(L.line, L.dot); });
    function set(t) {
      const W = box.clientWidth, K = W / 400, s = 1 - (1 - S) * t, vy = 90 - 360 * t, vh = 210 + 310 * t;
      svg.setAttribute('viewBox', `0 ${vy} 400 ${vh}`); svg.style.height = vh * K + 'px';
      pile.setAttribute('transform', `translate(${OX * t} 0) translate(200 190) scale(${s}) translate(-200 -190)`);
      layers.forEach(L => L.g.setAttribute('transform', `translate(${L.dx * t} ${-GAP * L.i * t}) rotate(${L.rot * t} 200 ${L.cy})`));
      const op = Math.max(0, Math.min(1, (t - .6) / .4)), LX = Math.round(W * .5); box.style.setProperty('--lab', op);
      let bottom = -1e9;
      lab.forEach(L => {
        const x0 = L.ax + L.dx * t, y0 = L.ay - GAP * L.i * t;
        let ax = (200 + OX * t + (x0 - 200) * s) * K; const ay = (190 + (y0 - 190) * s - vy) * K;
        ax = Math.min(ax + 4, LX - 24);
        let y = ay - 8; if (y < bottom + 6) y = bottom + 6;
        L.label.style.transform = `translate(${LX}px,${y}px)`; bottom = y + L.label.offsetHeight;
        L.line.setAttribute('points', `${ax},${ay} ${LX - 20},${ay} ${LX - 6},${y + 8}`); L.line.style.strokeDashoffset = 1 - op;
        L.dot.setAttribute('cx', ax); L.dot.setAttribute('cy', ay);
      });
      box.style.height = Math.max(vh * K, op > 0 ? bottom + 6 : 0) + 'px';
    }
    set(0); return { set };
  }
  function closeSheet() { const s = $('#sheet'); s.classList.remove('on', 'drag'); s.style.transform = ''; $('#scrim').classList.remove('on'); s.setAttribute('aria-hidden', 'true'); }
  $('#scrim').onclick = closeSheet;
  (() => { // tirer la poignée vers le bas pour fermer
    const s = $('#sheet'); let y0 = null, dy = 0;
    const down = e => { if (e.target.closest('#grab') || $('#sheetBody').scrollTop <= 0) { y0 = e.clientY; dy = 0; } };
    s.addEventListener('pointerdown', down);
    s.addEventListener('pointermove', e => { if (y0 == null) return; dy = e.clientY - y0; if (dy > 6) { s.classList.add('drag'); s.style.transform = `translateY(${dy}px)`; } });
    const up = () => { if (y0 == null) return; y0 = null; s.classList.remove('drag'); if (dy > 110) closeSheet(); else s.style.transform = ''; };
    s.addEventListener('pointerup', up); s.addEventListener('pointercancel', up);
  })();

  /* ---------- mode cuisiner ---------- */
  let ck = null, wakeLock = null;
  function openCook(id) {
    const r = DATA[id]; ck = { r, i: 0, timers: {} };
    $('#cookTitle').textContent = r.name;
    $('#segs').innerHTML = r.steps.map(() => '<i></i>').join('');
    $('#ingList').innerHTML = r.ingredients.map(x => `<li>${esc(x)}</li>`).join(''); $('#ingList').classList.remove('on'); $('#ingBtn').textContent = 'Voir les ingrédients';
    $('#cook').classList.add('on'); $('#cook').setAttribute('aria-hidden', 'false');
    renderStep(false); requestWake();
  }
  function closeCook() { $('#cook').classList.remove('on'); $('#cook').setAttribute('aria-hidden', 'true'); Object.values(ck?.timers || {}).forEach(t => clearInterval(t.h)); ck = null; if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; } }
  async function requestWake() {
    const w = $('#wake');
    try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); w.textContent = 'Écran maintenu allumé'; } else w.textContent = ''; }
    catch (_) { w.textContent = ''; }
  }
  const minutesIn = s => { const m = s.match(/(\d+)\s*min/); return m ? +m[1] : null; };
  function renderStep(anim = true) {
    const { r, i } = ck, s = r.steps[i], mins = minutesIn(s), T = ck.timers[i];
    document.querySelectorAll('#segs i').forEach((e, k) => e.classList.toggle('on', k <= i));
    $('#stage').className = 'stage' + (anim ? ' anim' : '');
    $('#stage').innerHTML = `<div class="num">${i + 1}<small> / ${r.steps.length}</small></div><p>${esc(s)}</p>
      ${mins ? `<button class="timer ${T ? (T.left <= 0 ? 'over' : 'run') : ''}" id="timer">${ring(T ? T.left / (mins * 60) : 1)}<span id="tl">${T ? fmt(T.left) : mins + ' min · lancer'}</span></button>` : ''}`;
    $('#prev').disabled = i === 0; $('#prev').style.opacity = i === 0 ? .35 : 1;
    $('#next').textContent = i === r.steps.length - 1 ? 'Terminé' : 'Suivant';
    const tb = $('#timer'); if (tb) tb.onclick = () => toggleTimer(i, mins);
  }
  const fmt = s => (s < 0 ? '+' : '') + Math.floor(Math.abs(s) / 60) + ':' + String(Math.abs(s) % 60).padStart(2, '0');
  const ring = f => { const C = 2 * Math.PI * 16; return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-opacity=".2" stroke-width="4"/><circle cx="20" cy="20" r="16" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - Math.max(0, f))}" transform="rotate(-90 20 20)"/></svg>`; };
  function toggleTimer(i, mins) {
    const T = ck.timers[i];
    if (T) { clearInterval(T.h); delete ck.timers[i]; return renderStep(false); }
    const t = ck.timers[i] = { left: mins * 60 };
    t.h = setInterval(() => {
      t.left--; if (!ck) return;
      if (t.left === 0) { navigator.vibrate && navigator.vibrate([300, 150, 300]); toast(`Minuteur de l'étape ${i + 1} terminé`); }
      if (ck.i === i) { const tl = $('#tl'), tb = $('#timer'); if (tl) tl.textContent = fmt(t.left); if (tb) { tb.className = 'timer ' + (t.left <= 0 ? 'over' : 'run'); tb.querySelector('svg').outerHTML = ring(t.left / (mins * 60)); } }
    }, 1000);
    renderStep(false);
  }
  const go = d => { if (!ck) return; const n = ck.i + d; if (n < 0) return; if (n >= ck.r.steps.length) { closeCook(); toast('Bon appétit.'); return; } ck.i = n; renderStep(); };
  $('#next').onclick = () => go(1); $('#prev').onclick = () => go(-1); $('#cookClose').onclick = closeCook;
  $('#ingBtn').onclick = () => { const l = $('#ingList'); l.classList.toggle('on'); $('#ingBtn').textContent = l.classList.contains('on') ? 'Masquer les ingrédients' : 'Voir les ingrédients'; };
  (() => { let x0 = null; const c = $('#cook'); c.addEventListener('pointerdown', e => { if (!e.target.closest('button')) x0 = e.clientX; }); c.addEventListener('pointerup', e => { if (x0 == null) return; const dx = e.clientX - x0; x0 = null; if (dx < -60) go(1); if (dx > 60) go(-1); }); })();
  document.addEventListener('keydown', e => { if (!ck) return; if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); if (e.key === 'Escape') closeCook(); });
  document.addEventListener('visibilitychange', () => { if (ck && document.visibilityState === 'visible' && !wakeLock) requestWake(); });

  /* ---------- divers ---------- */
  document.querySelectorAll('[data-soon]').forEach(b => b.onclick = () => toast('Cet écran arrive à l\'étape suivante'));
  $('#themeBtn').onclick = () => { const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = dark ? 'light' : 'dark'; };
  const d = new Date(); const J = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'], M = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  $('#date').innerHTML = `${J[d.getDay()]} <em>${d.getDate()} ${M[d.getMonth()]}</em>`;
  renderMeals(); renderDeck(true);
})();
</script>
